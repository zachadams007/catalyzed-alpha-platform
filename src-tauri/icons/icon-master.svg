<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Catalyzed Alpha app icon: the EngineCore reactor.
       Icon-ization of the Algorithm tab's living engine (EngineCore.tsx):
       dashed instrument rings + bright comet arc around the azure brand tile
       with its diagonal light-cross and white-hot core, on dark graphite, with
       a subliminal gold charged under-glow. Brand: azure #1ab2e8, deep azure
       #1577b8, azure-bright #7fd4ff, gold spark #d8a24c, graphite #080b10. -->
  <defs>
    <linearGradient id="tile" x1="0.08" y1="0.04" x2="0.96" y2="1">
      <stop offset="0" stop-color="#0e1925"/>
      <stop offset="0.55" stop-color="#080b10"/>
      <stop offset="1" stop-color="#04060a"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#1ab2e8" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#1ab2e8" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#1ab2e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1ab2e8" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#1ab2e8" stop-opacity="0.07"/>
      <stop offset="0.76" stop-color="#1ab2e8" stop-opacity="0"/>
      <stop offset="1" stop-color="#1ab2e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8a24c" stop-opacity="0.10"/>
      <stop offset="0.50" stop-color="#d8a24c" stop-opacity="0.24"/>
      <stop offset="0.76" stop-color="#d8a24c" stop-opacity="0"/>
      <stop offset="1" stop-color="#d8a24c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coreTile" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#0c6f9e"/>
      <stop offset="0.44" stop-color="#1ab2e8"/>
      <stop offset="0.72" stop-color="#3cc2f7"/>
      <stop offset="1" stop-color="#7fd4ff"/>
    </linearGradient>
    <radialGradient id="tileHi" cx="0.28" cy="0.22" r="1">
      <stop offset="0" stop-color="#7fd4ff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#7fd4ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7fd4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="379.5" y1="512" x2="644.5" y2="512">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.78" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamGlow" gradientUnits="userSpaceOnUse" x1="379.5" y1="512" x2="644.5" y2="512">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreDot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#tile)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#sheen)"/>
  <circle cx="512" cy="512" r="470" fill="url(#halo)"/>
  <circle cx="512" cy="512" r="430" fill="url(#goldGlow)"/>
  <circle cx="512" cy="512" r="380" fill="none" stroke="#1ab2e8" stroke-opacity="0.55" stroke-width="7" stroke-dasharray="8.066 29.24"/>
  <circle cx="512" cy="512" r="306" fill="none" stroke="#1ab2e8" stroke-opacity="0.65" stroke-width="9" stroke-dasharray="64.34 48.76"/>
  <circle cx="512" cy="512" r="380" fill="none" stroke="#7fd4ff" stroke-opacity="0.45" stroke-width="30" stroke-linecap="round" stroke-dasharray="167 2221" transform="rotate(-35 512 512)"/>
  <circle cx="512" cy="512" r="380" fill="none" stroke="#7fd4ff" stroke-width="14" stroke-linecap="round" stroke-dasharray="167 2221" transform="rotate(-35 512 512)"/>
  <rect x="328" y="328" width="368" height="368" rx="88" fill="url(#coreTile)"/>
  <rect x="328" y="328" width="368" height="368" rx="88" fill="url(#tileHi)"/>
  <rect x="328" y="328" width="368" height="368" rx="88" fill="none" stroke="#1ab2e8" stroke-opacity="0.55" stroke-width="4"/>
  <rect x="379.5" y="494" width="265" height="36" rx="18" fill="url(#beamGlow)" transform="rotate(45 512 512)"/>
  <rect x="379.5" y="494" width="265" height="36" rx="18" fill="url(#beamGlow)" transform="rotate(-45 512 512)"/>
  <rect x="379.5" y="504.5" width="265" height="15" rx="7.5" fill="url(#beam)" transform="rotate(45 512 512)"/>
  <rect x="379.5" y="504.5" width="265" height="15" rx="7.5" fill="url(#beam)" transform="rotate(-45 512 512)"/>
  <circle cx="512" cy="512" r="110" fill="url(#coreDot)"/>
  <rect x="46" y="46" width="932" height="932" rx="210" fill="none" stroke="#1ab2e8" stroke-opacity="0.55" stroke-width="8"/>
  <rect x="40" y="40" width="944" height="944" rx="216" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
</svg>
