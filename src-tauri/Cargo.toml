[package]
name = "catalyzed-alpha"
version = "0.1.0"
description = "Catalyzed Alpha — social-style discovery feed for US stock signals"
authors = ["Catalyzed Alpha"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "catalyzed_alpha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
