name: Daily broad-universe scan

# Computes the day's broad U.S. universe ONCE in the cloud (pre-market) and
# publishes it to the shared `daily_signals` Supabase cache. Every tester then
# reads that result with ZERO vendor API calls. This is the "proper" scheduler
# for the broad universe - it runs even when no one's machine is on.
#
# Setup (one time): in the GitHub repo → Settings → Secrets and variables →
# Actions, add the secrets referenced below (values from your local
# scripts/universe_scan/.scan.env). Then this runs automatically every day,
# and you can trigger it by hand from the Actions tab (Run workflow).

# PRIMARY trigger is now Supabase pg_cron (migration 0015), which calls this
# workflow's workflow_dispatch reliably at 11:00 UTC (7am EDT) - GitHub's own
# scheduled crons below are a SECONDARY fallback (they fire late/skip on the free
# tier, which is why the board often wasn't fresh). The publish guard makes every
# trigger idempotent, so the pg_cron dispatch + these slots never double-scan.
on:
  schedule:
    # Daily UTC slots, including weekends. Scheduled (not on-demand) GitHub Actions are
    # best-effort and routinely start late - top-of-the-hour ("0 *") slots see
    # the worst congestion (we observed a "0 11" job not firing until ~14:00 UTC,
    # publishing ~10:14 EDT, well AFTER the 9:30 EDT open). Picking an early,
    # off-the-hour minute (09:35 UTC) gives a wide buffer so that even with the
    # typical delay the cache is published before the 13:30 UTC / 9:30 EDT open.
    # NOTE: GitHub does not guarantee on-time scheduled runs and ROUTINELY SKIPS
    # them entirely (observed 06-20/21/22 not firing). So we schedule the pre-market
    # slot PLUS two backup slots later in the day; the "guard" step below makes each
    # run a no-op if today's board is already published, so on a normal day only the
    # first slot actually scans (no wasted API budget) and a skipped morning still
    # gets caught intraday (the live-price overlay keeps prices current regardless).
    # The client also boots to the most-recent board (fetchRecentSharedSignals), so a
    # fully-missed day shows yesterday's board, never an empty screen.
    # Target: the board is published by ~7:00 EDT. GitHub's free scheduler runs
    # scheduled jobs LATE (we measured a "9:35 UTC" slot not firing until 12:21 UTC
    # - ~2h45m late), so we fan out several EARLY-morning UTC slots; the publish
    # guard below makes all but the first a no-op, so extra slots cost nothing but
    # raise the odds the board lands before 7 EDT despite the delay.
    - cron: "0 9 * * *" # 5:00 EDT target (earliest; absorbs the worst delay)
    - cron: "30 9 * * *" # 5:30 EDT
    - cron: "0 10 * * *" # 6:00 EDT
    - cron: "30 10 * * *" # 6:30 EDT
    - cron: "0 11 * * *" # 7:00 EDT (the target itself)
    - cron: "35 13 * * *" # backup if every morning slot was skipped
    - cron: "35 17 * * *" # last-resort intraday backup
  workflow_dispatch:
    inputs:
      target:
        description: "How many top names to fully score & publish"
        required: false
        default: "500"

concurrency:
  group: daily-universe
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Guard: only scan if today's board isn't published yet (a manual dispatch
      # always forces a fresh scan). Lets the backup cron slots run safely without
      # re-spending API budget when the morning slot already succeeded.
      - name: Decide whether to scan
        id: guard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — forcing a fresh scan."
            exit 0
          fi
          DAY=$(TZ=America/New_York date +%F)
          ROWS=$(curl -s "$SUPABASE_URL/rest/v1/daily_signals?select=market_day&market_day=eq.$DAY" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" || echo "")
          if echo "$ROWS" | grep -q "$DAY"; then
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
            echo "Today ($DAY) is already published — skipping (backup slot, no-op)."
          else
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            echo "No board for $DAY yet — scanning."
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.should_scan == 'true'

      - uses: actions/setup-node@v5
        if: steps.guard.outputs.should_scan == 'true'
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
        if: steps.guard.outputs.should_scan == 'true'

      # vite-node reads VITE_* from a .env file; write it from Action secrets so
      # the engine fetches with the current keys. This file lives only on the
      # ephemeral runner and is never committed.
      - name: Write .env for the scan
        if: steps.guard.outputs.should_scan == 'true'
        run: |
          {
            echo "VITE_FINNHUB_API_KEY=${{ secrets.VITE_FINNHUB_API_KEY }}"
            echo "VITE_FINNHUB_API_KEY_2=${{ secrets.VITE_FINNHUB_API_KEY_2 }}"
            echo "VITE_FINNHUB_API_KEY_3=${{ secrets.VITE_FINNHUB_API_KEY_3 }}"
            echo "VITE_FINNHUB_API_KEY_4=${{ secrets.VITE_FINNHUB_API_KEY_4 }}"
            echo "VITE_FINNHUB_API_KEY_5=${{ secrets.VITE_FINNHUB_API_KEY_5 }}"
            echo "VITE_FINNHUB_API_KEY_6=${{ secrets.VITE_FINNHUB_API_KEY_6 }}"
            echo "VITE_FINNHUB_API_KEY_7=${{ secrets.VITE_FINNHUB_API_KEY_7 }}"
            echo "VITE_ALPACA_API_KEY=${{ secrets.VITE_ALPACA_API_KEY }}"
            echo "VITE_ALPACA_API_SECRET=${{ secrets.VITE_ALPACA_API_SECRET }}"
            echo "VITE_FMP_API_KEY=${{ secrets.VITE_FMP_API_KEY }}"
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"
            # SEC EDGAR blocks GitHub's datacenter IP, so the catalyst sources (8-K /
            # 13D / Form-4) route through the Supabase market-proxy's /sec relay (an
            # allowed IP). SEC-ONLY var: the keyed vendors (Finnhub/Alpaca/FMP) stay
            # direct because VITE_MARKET_PROXY_URL is intentionally NOT set here.
            echo "VITE_SEC_PROXY_URL=${{ secrets.VITE_SEC_PROXY_URL }}"
          } > .env

      - name: Run broad-universe scan
        if: steps.guard.outputs.should_scan == 'true'
        env:
          # Server-only - bypasses RLS to publish the shared row.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Anon key - lets the scan's catalyst-DISCOVERY step call the
          # research-agent edge function (catalyst_scan) and then upsert the
          # discovered catalysts (with the service-role key) into the cache.
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          UNIVERSE_TARGET: ${{ github.event.inputs.target || '500' }}
          CATALYZED_CODE_REVISION: ${{ github.sha }}
        run: npm run scan:universe

      - name: Retain local learning-universe evidence
        if: always() && steps.guard.outputs.should_scan == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: learning-universe-${{ github.run_id }}-${{ github.run_attempt }}
          path: scripts/universe_scan/learning-archive/**
          if-no-files-found: warn
          retention-days: 90
